  <style>
    :root {
      --paper: #f5f2e9;
      --ink: #1d2923;
      --green: #345b48;
      --muted: #777b70;
      --line: #dcd9cf;
      --white: #fffef9;
    }

    * { box-sizing: border-box; }
    html, body { background: var(--paper); }
    body { margin: 0; }

    #app {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Tahoma, Arial, sans-serif;
    }

    .wrap {
      width: min(1100px, 91%);
      margin: auto;
    }

    header {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: bold;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--green);
      color: white;
      font-size: 21px;
    }

    .live {
      color: var(--green);
      font-size: 13px;
    }

    .hero {
      padding: 55px 0 35px;
    }

    .eyebrow {
      color: var(--green);
      font-size: 13px;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(40px, 7vw, 68px);
      font-weight: 500;
    }

    .intro {
      color: var(--muted);
      line-height: 1.9;
    }

    .player {
      background: var(--green);
      color: white;
      padding: 22px;
      margin-top: 25px;
    }

    .player-label {
      color: #dce6dc;
      font-size: 13px;
    }

    #currentStation {
      margin: 10px 0 16px;
      font-size: 20px;
    }

    audio {
      width: 100%;
      height: 42px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 38px 0 18px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 500;
    }

    #stationSearch {
      width: min(320px, 55%);
      padding: 11px 13px;
      border: 1px solid var(--line);
      background: var(--white);
      font: inherit;
      outline-color: var(--green);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
      padding-bottom: 50px;
    }

    .station-card {
      min-height: 115px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px;
      border: 1px solid var(--line);
      background: var(--white);
    }

    .station-name {
      font-size: 15px;
      line-height: 1.6;
    }

    .station-category {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .station-card button {
      flex: 0 0 auto;
      padding: 9px 11px;
      border: 0;
      background: var(--green);
      color: white;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .station-card button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #message {
      padding: 18px 0;
      color: var(--muted);
      line-height: 1.8;
    }

    footer {
      padding: 18px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 720px) {
      .cards { grid-template-columns: 1fr; }
      .section-head {
        align-items: stretch;
        flex-direction: column;
      }
      #stationSearch { width: 100%; }
    }
  </style>

      id: String(i + 1),
      name,
      category,
      radio_url: u.startsWith("http") ? u : "https://qurango.net/radio/" + u
    }));
    

    const radio = document.getElementById("radio");
    const currentStation = document.getElementById("currentStation");
    const stationList = document.getElementById("stationList");
    const message = document.getElementById("message");
    const search = document.getElementById("stationSearch");

    let stations = [];
    let playingButton = null;

    function getStationsFromSource(source) {
      const match = source.match(
        /(?:const|let|var)\s+Stations\s*=\s*(\[[\s\S]*?\])\s*;/
      );

      if (!match) {
        throw new Error("لم أجد قائمة Stations داخل ملف GitHub.");
      }

      // يستخرج بيانات القائمة فقط من ملف الإذاعات
      return new Function('"use strict"; return (' + match[1] + ');')();
    }

    function renderStations(query = "") {
      stationList.replaceChildren();

      const filtered = stations.filter(station => {
        const text = [
          station.name,
          station.category,
          station.radio_name
        ].filter(Boolean).join(" ").toLowerCase();

        return text.includes(query.trim().toLowerCase());
      });

      if (!filtered.length) {
        message.textContent = "مفيش إذاعات مطابقة للبحث.";
        return;
      }

      message.textContent = "";

      filtered.forEach(station => {
        const streamUrl = station.radio_url || station.url || station.stream || "";

        const card = document.createElement("article");
        card.className = "station-card";

        const info = document.createElement("div");

        const name = document.createElement("div");
        name.className = "station-name";
        name.textContent = station.name || station.radio_name || "إذاعة قرآن كريم";

        const category = document.createElement("small");
        category.className = "station-category";
        category.textContent = station.category || "إذاعة قرآنية";

        info.append(name, category);

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = streamUrl ? "▶ تشغيل" : "غير متاح";
        button.disabled = !streamUrl;

        button.addEventListener("click", async () => {
          if (playingButton && playingButton !== button) {
            playingButton.textContent = "▶ تشغيل";
          }

          if (radio.dataset.stream === streamUrl && !radio.paused) {
            radio.pause();
            button.textContent = "▶ تشغيل";
            currentStation.textContent = "تم إيقاف: " + name.textContent;
            return;
          }

          radio.dataset.stream = streamUrl;
          radio.src = streamUrl;
          radio.load();

          currentStation.textContent = "جاري تشغيل: " + name.textContent;
          playingButton = button;

          try {
            await radio.play();
            button.textContent = "Ⅱ إيقاف";
          } catch (error) {
            button.textContent = "▶ تشغيل";
            currentStation.textContent =
              "تعذّر تشغيل هذه الإذاعة؛ قد يكون رابطها متوقفًا.";
          }
        });

        card.append(info, button);
        stationList.appendChild(card);
      });
    }

    search.addEventListener("input", () => renderStations(search.value));

    radio.addEventListener("pause", () => {
      if (playingButton) playingButton.textContent = "▶ تشغيل";
    });

    radio.addEventListener("playing", () => {
      if (playingButton) playingButton.textContent = "Ⅱ إيقاف";
    });

    function loadStations() {
      stations = Stations;
      renderStations();
      currentStation.textContent = "اختار إذاعة من القائمة";
    }

    loadStations();
