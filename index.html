    .player {
      background: var(--green);

      margin: 10px 0 16px;
      font-size: 20px;
    }

    audio {
      width: 100%;
      height: 42px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 38px 0 18px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--line);

      margin: 0;
      font-size: 22px;
      font-weight: 500;
    }

    #stationSearch {
      width: min(320px, 55%);
      padding: 11px 13px;
      border: 1px solid var(--line);
      background: var(--white);
      font: inherit;
      outline-color: var(--green);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
      padding-bottom: 50px;
    }

    .station-card {
      min-height: 115px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px;
      border: 1px solid var(--line);
      background: var(--white);
    }

    .station-name {
      font-size: 15px;
      line-height: 1.6;
    }

    .station-category {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .station-card button {
      flex: 0 0 auto;
      padding: 9px 11px;
      border: 0;
      background: var(--green);
      color: white;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .station-card button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #message {
      padding: 18px 0;
      color: var(--muted);
      line-height: 1.8;
    }

    footer {
      padding: 18px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 720px) {
      .cards { grid-template-columns: 1fr; }

        align-items: stretch;
        flex-direction: column;

    const radio = document.getElementById("radio");
    const currentStation = document.getElementById("currentStation");
    const stationList = document.getElementById("stationList");
    const message = document.getElementById("message");
    const search = document.getElementById("stationSearch");

    let stations = [];
    let playingButton = null;

    function getStationsFromSource(source) {
      const match = source.match(
        /(?:const|let|var)\s+Stations\s*=\s*(\[[\s\S]*?\])\s*;/
      );

      if (!match) {
        throw new Error("لم أجد قائمة Stations داخل ملف GitHub.");
      }

      // يستخرج بيانات القائمة فقط من ملف الإذاعات
      return new Function('"use strict"; return (' + match[1] + ');')();
    }

    function renderStations(query = "") {
      stationList.replaceChildren();

      const filtered = stations.filter(station => {
        const text = [
          station.name,
          station.category,
          station.radio_name
        ].filter(Boolean).join(" ").toLowerCase();

        return text.includes(query.trim().toLowerCase());
      });

      if (!filtered.length) {
        message.textContent = "مفيش إذاعات مطابقة للبحث.";
        return;
      }

      message.textContent = "";

      filtered.forEach(station => {
        const streamUrl = station.radio_url || station.url || station.stream || "";

        const card = document.createElement("article");
        card.className = "station-card";

        const info = document.createElement("div");

        const name = document.createElement("div");
        name.className = "station-name";
        name.textContent = station.name || station.radio_name || "إذاعة قرآن كريم";

        const category = document.createElement("small");
        category.className = "station-category";
        category.textContent = station.category || "إذاعة قرآنية";

        info.append(name, category);

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = streamUrl ? "▶ تشغيل" : "غير متاح";
        button.disabled = !streamUrl;

        button.addEventListener("click", async () => {
          if (playingButton && playingButton !== button) {
            playingButton.textContent = "▶ تشغيل";
          }

          if (radio.dataset.stream === streamUrl && !radio.paused) {
            radio.pause();
            button.textContent = "▶ تشغيل";
            currentStation.textContent = "تم إيقاف: " + name.textContent;
            return;
          }

          radio.dataset.stream = streamUrl;
          radio.src = streamUrl;
          radio.load();

          currentStation.textContent = "جاري تشغيل: " + name.textContent;
          playingButton = button;

          try {
            await radio.play();
            button.textContent = "Ⅱ إيقاف";
          } catch (error) {
            button.textContent = "▶ تشغيل";
            currentStation.textContent =
              "تعذّر تشغيل هذه الإذاعة؛ قد يكون رابطها متوقفًا.";
          }
        });

        card.append(info, button);
        stationList.appendChild(card);
      });
    }

    search.addEventListener("input", () => renderStations(search.value));

    radio.addEventListener("pause", () => {
      if (playingButton) playingButton.textContent = "▶ تشغيل";
    });

    radio.addEventListener("playing", () => {
      if (playingButton) playingButton.textContent = "Ⅱ إيقاف";
    });

    function loadStations() {
      stations = Stations;
      renderStations();
      currentStation.textContent = "اختار إذاعة من القائمة";
    }

         &quot;content&quot;: &quot; وَسِعَ رَبُّنَا كُلَّ شَيْءٍ عِلْماً عَلَى اللّهِ تَوَكَّلْنَا رَبَّنَا افْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِالْحَقِّ وَأَنتَ خَيْرُ الْفَاتِحِينَ. [الأعراف - 89]. &quot;
      },
      {

         &quot;count&quot;: &quot;01&quot;,
         &quot;description&quot;: &quot;موسى علية السلام.&quot;,
         &quot;reference&quot;: &quot;. [الممتحنة - 4-5].&quot;,
         &quot;content&quot;: &quot; رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي. [القصص - 16]. رَبِّ بِمَا أَنْعَمْتَ عَلَيَّ فَلَنْ أَكُونَ ظَهِيراً لِّلْمُجْرِمِينَ. [القصص - 17]. رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ. [القصص - 24]. رَبِّ اشْرَحْ لِي صَدْرِي (25) وَيَسِّرْ لِي أَمْرِي (26) وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي (27) يَفْقَهُوا قَوْلِي (28). [طه - 25-28]. &quot;
      },
      {
         &quot;category&quot;: &quot;أدعية الأنبياء&quot;,
         &quot;count&quot;: &quot;01&quot;,
         &quot;description&quot;: &quot;أيوب علية السلام.&quot;,

      },
      {
         &quot;category&quot;: &quot;أدعية الأنبياء&quot;,
         &quot;count&quot;: &quot;01&quot;,

         &quot;content&quot;: &quot; رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ. [النمل - 19]. &quot;

         &quot;reference&quot;: &quot;. [يوسف - 101].&quot;,
         &quot;content&quot;: &quot; إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ. [يوسف - 86]. &quot;

const picker = document.getElementById(&quot;categoryPicker&quot;);
const listEl = document.getElementById(&quot;list&quot;);
const progressText = document.getElementById(&quot;progressText&quot;);
const barFill = document.getElementById(&quot;barFill&quot;);

const categories = Object.keys(AZKAR);
let current = categories[0];

function storageKey(cat) {
  return &quot;azkar_progress_&quot; + cat;
}
function loadState(cat) {
  try { return JSON.parse(localStorage.getItem(storageKey(cat))) || {}; }
  catch (e) { return {}; }
}
function saveState(cat, state) {
  try { localStorage.setItem(storageKey(cat), JSON.stringify(state)); } catch (e) {}
}
function target(item) {
  const n = parseInt(String(item.count).trim(), 10);
  return isNaN(n) || n &lt; 1 ? 1 : n;
}
function clean(s) {
  return (s || &quot;&quot;).trim();
}

function buildPicker() {
  categories.forEach(cat =&gt; {
    const opt = document.createElement(&quot;option&quot;);
    opt.value = cat;
    opt.textContent = cat + &quot; (&quot; + AZKAR[cat].length + &quot;)&quot;;
    picker.appendChild(opt);
  });
  picker.addEventListener(&quot;change&quot;, () =&gt; {
    current = picker.value;
    render();
  });
}

function render() {
  const items = AZKAR[current] || [];
  const state = loadState(current);
  listEl.replaceChildren();

  if (!items.length) {
    const e = document.createElement(&quot;div&quot;);
    e.className = &quot;empty&quot;;
    e.textContent = &quot;لا توجد أذكار في هذا القسم.&quot;;
    listEl.appendChild(e);
    progressText.textContent = &quot;&quot;;
    barFill.style.width = &quot;0%&quot;;
    return;
  }

  let doneCount = 0;

  items.forEach((item, i) =&gt; {
    const total = target(item);
    const done = Math.min(state[i] || 0, total);
    const finished = done &gt;= total;
    if (finished) doneCount++;

    const card = document.createElement(&quot;div&quot;);
    card.className = &quot;card&quot; + (finished ? &quot; done&quot; : &quot;&quot;);

    const text = document.createElement(&quot;p&quot;);
    text.className = &quot;text&quot;;
    text.textContent = clean(item.content);
    card.appendChild(text);

    const desc = clean(item.description);
    if (desc) {
      const d = document.createElement(&quot;p&quot;);
      d.className = &quot;desc&quot;;
      d.textContent = desc;
      card.appendChild(d);
    }

    const ref = clean(item.reference).replace(/^\.\s*/, &quot;&quot;);
    if (ref) {
      const r = document.createElement(&quot;p&quot;);
      r.className = &quot;ref&quot;;
      r.textContent = ref;
      card.appendChild(r);
    }

    const row = document.createElement(&quot;div&quot;);
    row.className = &quot;row&quot;;

    const count = document.createElement(&quot;span&quot;);
    count.className = &quot;count&quot;;
    count.textContent = done + &quot; / &quot; + total;

    const btn = document.createElement(&quot;button&quot;);
    btn.className = &quot;tap&quot;;
    btn.type = &quot;button&quot;;
    btn.textContent = finished ? &quot;تم ✓&quot; : &quot;اضغط للعد&quot;;
    btn.disabled = finished;
    btn.addEventListener(&quot;click&quot;, () =&gt; {
      const s = loadState(current);
      s[i] = Math.min((s[i] || 0) + 1, total);
      saveState(current, s);
      render();
    });

    row.append(count, btn);
    card.appendChild(row);
    listEl.appendChild(card);
  });

  progressText.textContent = &quot;أتممت &quot; + doneCount + &quot; من &quot; + items.length;
  barFill.style.width = (doneCount / items.length * 100) + &quot;%&quot;;
}

document.getElementById(&quot;resetBtn&quot;).addEventListener(&quot;click&quot;, () =&gt; {
  if (confirm(&quot;تعيد ضبط العدّ لقسم «&quot; + current + &quot;»؟&quot;)) {
    saveState(current, {});
    render();
  }
});

buildPicker();
picker.value = current;
render();
&lt;/script&gt;
&lt;/body&gt;

<script>
  (function () {
    const radioPane = document.getElementById("pane-radio");
    const azkarPane = document.getElementById("pane-azkar");
    const tabRadio = document.getElementById("tabRadio");
    const tabAzkar = document.getElementById("tabAzkar");
    function show(which) {
      const radioOn = which === "radio";
      radioPane.hidden = !radioOn;
      azkarPane.hidden = radioOn;
      tabRadio.classList.toggle("active", radioOn);
      tabAzkar.classList.toggle("active", !radioOn);
    }
    tabRadio.addEventListener("click", () => show("radio"));
    tabAzkar.addEventListener("click", () => show("azkar"));
  })();
</script>
